# Tool settings for the backend. Dependencies live in requirements.txt.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
filterwarnings = [
    # Printed by flaml (an AutoGen dependency) on import. Not about our code.
    "ignore:flaml.automl is not available:UserWarning",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", "chroma_data", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = [
    "B008",  # FastAPI's `Depends(...)` in default arguments is the normal pattern
]

[tool.ruff.lint.per-file-ignores]
# conftest.py must set test settings before it imports the app.
"tests/conftest.py" = ["E402"]
